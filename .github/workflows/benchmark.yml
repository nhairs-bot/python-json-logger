name: Benchmark JSON formatters

on:
  workflow_dispatch:
  push:
    branches: [brave-pelican/benchmark-label-smoke]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: managed

jobs:
  benchmark:
    name: Benchmark supported Python runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Measure formatters sequentially with tox
        run: uvx --with tox-uv tox -m benchmark -- --benchmark-disable
